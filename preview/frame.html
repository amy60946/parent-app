<title>ParentApp Önizleme</title>
<style>
  /* Düzen: ortada telefon boyutunda uygulama, altında tek satır bilgi ve sıfırlama. Dar ekranda uygulama tüm ekranı kaplar. */
  :root {
    --ground: #E9ECF3;
    --ink: #0F1B3D;
    --muted: #6E7690;
    --bezel: #0F1B3D;
    --line: #D5DAE6;
    --danger: #B3263E;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ground: #0B1226; --ink: #E6EAF5; --muted: #8F98B3; --bezel: #26324F; --line: #26324F; --danger: #F07A8C; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --ground: #0B1226; --ink: #E6EAF5; --muted: #8F98B3; --bezel: #26324F; --line: #26324F; --danger: #F07A8C; color-scheme: dark; }

  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font); }
  .stage {
    min-height: 100%; box-sizing: border-box; padding: 20px 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  .phone {
    width: 390px; max-width: 100%; height: min(844px, calc(100vh - 110px)); min-height: 560px;
    border: 10px solid var(--bezel); border-radius: 46px; overflow: hidden; background: #F5F6F8;
    box-shadow: 0 24px 60px rgba(15, 27, 61, 0.18);
  }
  .phone iframe { width: 100%; height: 100%; border: 0; display: block; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 16px; font-size: 12px; color: var(--muted); max-width: 390px; text-align: center; }
  .bar b { color: var(--ink); font-weight: 600; user-select: all; }
  button {
    font: inherit; font-size: 12px; color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button.confirm { color: var(--danger); border-color: var(--danger); }

  @media (max-width: 480px) {
    .stage { padding: 0; gap: 0; justify-content: flex-start; }
    .phone { width: 100%; height: calc(100vh - 44px); min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
    .bar { padding: 10px 16px; }
  }
</style>

<div class="stage">
  <div class="phone"><iframe id="app" src="app.html" title="ParentApp uygulaması"></iframe></div>
  <div class="bar">
    <span>Deneme veritabanı · Hazır hesap: <b>demo@parentapp.app</b> / <b>12345678</b></span>
    <button id="reset" type="button">Baştan başlat</button>
  </div>
</div>

<script>
  const btn = document.getElementById('reset');
  let armed = false, timer;
  btn.addEventListener('click', () => {
    if (!armed) {
      armed = true;
      btn.textContent = 'Tüm deneme verisi silinsin mi? Evet';
      btn.classList.add('confirm');
      timer = setTimeout(() => { armed = false; btn.textContent = 'Baştan başlat'; btn.classList.remove('confirm'); }, 4000);
      return;
    }
    clearTimeout(timer);
    try { localStorage.removeItem('parentapp-onizleme-v1'); } catch (e) { /* depolama kapalı */ }
    document.getElementById('app').src = 'app.html?' + Date.now();
    armed = false; btn.textContent = 'Baştan başlat'; btn.classList.remove('confirm');
  });
</script>
