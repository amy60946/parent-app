name: iOS (TestFlight)

# ParentApp (ebeveyn uygulaması) → macOS'ta expo prebuild + xcodebuild (otomatik imza, App Store Connect API anahtarı) → TestFlight.
# Elle: Actions → "iOS (TestFlight)" → Run workflow. Otomatik: commit mesajında [ios] geçerse. Gerekli secret'lar: docs/TESTFLIGHT.md
on:
  workflow_dispatch:
  push:
    branches: [claude/zen-noether-nlt3wm, main]

concurrency:
  group: parentapp-ios
  cancel-in-progress: false

jobs:
  testflight:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios]')
    runs-on: macos-26
    timeout-minutes: 120
    env:
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Secret denetimi
        run: |
          miss=""
          for v in SUPABASE_PUBLISHABLE_KEY ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -z "${!v}" ] && miss="$miss $v"
          done
          if [ -n "$miss" ]; then echo "::error::Eksik secret:$miss (docs/TESTFLIGHT.md)"; exit 1; fi
          case "$SUPABASE_PUBLISHABLE_KEY" in sb_secret_*) echo "::error::SUPABASE_PUBLISHABLE_KEY gizli anahtar; publishable anahtarı yaz."; exit 1;; esac
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Sunucu ayarı (.env)
        run: printf 'EXPO_PUBLIC_SUPABASE_URL=https://uhelhxqgpcjemadhsifx.supabase.co\nEXPO_PUBLIC_SUPABASE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" > .env
      - name: Derle, imzala, TestFlight'a yükle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash tools/ci/ios-testflight.sh
